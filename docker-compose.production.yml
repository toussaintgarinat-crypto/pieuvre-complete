version: '3.8'

# ====================================================================
# PIEUVRE AUTO - Docker Compose Production
# ====================================================================

services:
  # ====================================================================
  # Base de données PostgreSQL avec pgvector
  # ====================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pieuvre-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pieuvre_db}
      POSTGRES_USER: ${DB_USER:-pieuvre_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pieuvre_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pieuvre-database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pieuvre_user} -d ${DB_NAME:-pieuvre_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pieuvre-network

  # ====================================================================
  # API Node.js
  # ====================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pieuvre-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3001}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pieuvre_db}
      DB_USER: ${DB_USER:-pieuvre_user}
      DB_PASSWORD: ${DB_PASSWORD:-pieuvre_pass}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      # RAG / Embeddings
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Pieuvre Auto}
      RAG_MOCK_MODE: ${RAG_MOCK_MODE:-false}
      # OCR / Vision
      VISION_PROVIDER: ${VISION_PROVIDER:-openai}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-gpt-4o-mini}
      VISION_API_BASE: ${VISION_API_BASE:-https://api.openai.com/v1}
      VISION_MOCK_MODE: ${VISION_MOCK_MODE:-false}
      OCR_SERVICE_URL: http://ocr:3002
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - pieuvre-network

  # ====================================================================
  # OCR Service
  # ====================================================================
  ocr:
    build:
      context: .
      dockerfile: pieuvre-ocr/Dockerfile
    container_name: pieuvre-ocr
    restart: unless-stopped
    environment:
      PORT: 3002
      NODE_ENV: production
      VISION_PROVIDER: ${VISION_PROVIDER:-openai}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-gpt-4o-mini}
      VISION_API_BASE: ${VISION_API_BASE:-https://api.openai.com/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Pieuvre Auto}
      VISION_MOCK_MODE: ${VISION_MOCK_MODE:-false}
    ports:
      - "3002:3002"
    volumes:
      - uploads_data:/app/uploads:ro
    networks:
      - pieuvre-network

  # ====================================================================
  # Frontend React (build static)
  # ====================================================================
  frontend:
    image: node:18-alpine
    container_name: pieuvre-frontend
    working_dir: /app
    command: >
      sh -c "npm install && npm run build && npx serve -s dist -l 3000"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VITE_API_URL: /api
    volumes:
      - ./pieuvre-frontend:/app
      - /app/node_modules
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - pieuvre-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pieuvre.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.pieuvre.entrypoints=web"
      - "traefik.http.services.pieuvre.loadbalancer.server.port=3000"

  # ====================================================================
  # Reverse Proxy (Traefik) - Optionnel
  # ====================================================================
  # traefik:
  #   image: traefik:v3.0
  #   container_name: pieuvre-traefik
  #   restart: unless-stopped
  #   command:
  #     - "--api.insecure=true"
  #     - "--providers.docker=true"
  #     - "--providers.docker.network=pieuvre-network"
  #     - "--entrypoints.web.address=:80"
  #     - "--entrypoints.websecure.address=:443"
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "8080:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   networks:
  #     - pieuvre-network

# ====================================================================
# Networks
# ====================================================================
networks:
  pieuvre-network:
    driver: bridge

# ====================================================================
# Volumes
# ====================================================================
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local