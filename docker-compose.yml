version: '3.8'

services:
  # ====================================================================
  # Base de données PostgreSQL
  # ====================================================================
  postgres:
    image: postgres:16-alpine
    container_name: pieuvre-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pieuvre_db
      POSTGRES_USER: pieuvre_user
      POSTGRES_PASSWORD: pieuvre_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pieuvre-database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pieuvre_user -d pieuvre_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pieuvre-network

  # ====================================================================
  # API Node.js
  # ====================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pieuvre-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pieuvre_db
      DB_USER: pieuvre_user
      DB_PASSWORD: pieuvre_pass
      WEB_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - pieuvre-network

  # ====================================================================
  # Frontend React (nginx)
  # ====================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pieuvre-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - pieuvre-network

networks:
  pieuvre-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
