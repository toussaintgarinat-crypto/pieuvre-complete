version: '3.8'

services:
  # ====================================================================
  # Base de données PostgreSQL avec pgvector
  # ====================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pieuvre-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pieuvre_db
      POSTGRES_USER: pieuvre_user
      POSTGRES_PASSWORD: pieuvre_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pieuvre-database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pieuvre_user -d pieuvre_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pieuvre-network

  # ====================================================================
  # API Node.js
  # ====================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pieuvre-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pieuvre_db
      DB_USER: pieuvre_user
      DB_PASSWORD: pieuvre_pass
      WEB_URL: http://localhost
      # RAG / Embeddings
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Pieuvre Auto}
      RAG_MOCK_MODE: ${RAG_MOCK_MODE:-false}
      # OCR / Vision
      VISION_PROVIDER: ${VISION_PROVIDER:-openai}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-gpt-4o-mini}
      VISION_API_BASE: ${VISION_API_BASE:-https://api.openai.com/v1}
      VISION_MOCK_MODE: ${VISION_MOCK_MODE:-false}
      OCR_SERVICE_URL: http://ocr:3002
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - pieuvre-network
    volumes:
      - uploads_data:/app/uploads

  # ====================================================================
  # OCR Service
  # ====================================================================
  ocr:
    build:
      context: .
      dockerfile: pieuvre-ocr/Dockerfile
    container_name: pieuvre-ocr
    restart: unless-stopped
    environment:
      PORT: 3002
      NODE_ENV: production
      VISION_PROVIDER: ${VISION_PROVIDER:-openai}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-gpt-4o-mini}
      VISION_API_BASE: ${VISION_API_BASE:-https://api.openai.com/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Pieuvre Auto}
      VISION_MOCK_MODE: ${VISION_MOCK_MODE:-false}
    ports:
      - "3002:3002"
    volumes:
      - uploads_data:/app/uploads:ro
    networks:
      - pieuvre-network

  # ====================================================================
  # Frontend React (nginx)
  # ====================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pieuvre-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - pieuvre-network

networks:
  pieuvre-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
